<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · CodePush Server</title>
  <meta name="keywords" content="code-push-server,code-push,react-native,cordova">
  <meta name="description"
    content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  <script src="/html/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/html/css/theme.css">
</head>

<body class="min-h-screen bg-surface-dim text-onSurface antialiased">
  <header class="border-b border-outline-variant bg-surface/90 backdrop-blur sticky top-0 z-10">
    <div class="mx-auto max-w-3xl px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="h-10 w-10 rounded-lg bg-primary-container text-primary-onContainer flex items-center justify-center">
          <span class="material-symbols-rounded" style="font-size:22px">rocket_launch</span>
        </div>
        <span class="font-medium text-lg text-onSurface">CodePush Server</span>
      </a>
      <a href="/" class="m3-icon-btn" title="Back">
        <span class="material-symbols-rounded">arrow_back</span>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-md px-4 py-12">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-normal tracking-tight text-onSurface">Change password</h1>
      <p class="mt-2 text-sm text-onSurface-variant">Enter your current password and choose a new one.</p>
    </div>

    <div class="container bg-surface-containerLow rounded-xl shadow-m3-1 border border-outline-variant p-8">
      <form class="col-md-5 col-md-offset-3" id="form" method="post">
        <div class="space-y-4">
          <div class="form-group">
            <label class="block text-sm font-medium text-onSurface-variant mb-1.5" for="inputPassword">Old password</label>
            <input class="form-control m3-field" id="inputPassword" type="password" name="oldPassword"
              placeholder="Current password" required>
          </div>
          <div class="form-group">
            <label class="block text-sm font-medium text-onSurface-variant mb-1.5" for="inputNewPassword">New password</label>
            <input class="form-control m3-field" id="inputNewPassword" type="password" name="newPassword"
              placeholder="New password" required>
          </div>
        </div>
        <div class="form-group mt-6">
          <a class="btn m3-btn m3-btn-filled w-full py-3" id="submitBtn">Change password</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/jquery-3.1.1.min.js"></script>
  <script src="/html/js/auth.js"></script>
  <script src="/html/js/password.js"></script>
</body>

</html>
