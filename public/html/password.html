<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · CodePush Server</title>
  <meta name="keywords" content="code-push-server,code-push,react-native,cordova">
  <meta name="description"
    content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white/80 backdrop-blur sticky top-0 z-10">
    <div class="mx-auto max-w-3xl px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-xl bg-brand-600 flex items-center justify-center shadow-md shadow-brand-600/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v6" /><path d="M4.93 10.93 9 15" /><path d="M2 18h6" /><path d="M22 6h-6" />
            <path d="M15 9l4.07-4.07" /><circle cx="12" cy="18" r="4" />
          </svg>
        </div>
        <span class="font-semibold text-slate-900">CodePush Server</span>
      </a>
      <a href="/" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
        Back
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-md px-4 py-12">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Change password</h1>
      <p class="mt-2 text-sm text-slate-500">Enter your current password and choose a new one.</p>
    </div>

    <div class="container bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8">
      <form class="col-md-5 col-md-offset-3" id="form" method="post">
        <div class="space-y-4">
          <div class="form-group">
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="inputPassword">Old password</label>
            <input
              class="form-control block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
              id="inputPassword" type="password" name="oldPassword" placeholder="Current password" required>
          </div>
          <div class="form-group">
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="inputNewPassword">New password</label>
            <input
              class="form-control block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
              id="inputNewPassword" type="password" name="newPassword" placeholder="New password" required>
          </div>
        </div>
        <div class="form-group mt-6">
          <a class="btn btn-lg btn-primary btn-block inline-flex w-full cursor-pointer items-center justify-center rounded-lg bg-brand-600 px-4 py-2.5 font-medium text-white shadow-sm hover:bg-brand-700 focus:ring-2 focus:ring-brand-500/40 focus:outline-none transition"
            id="submitBtn">Change password</a>
        </div>
      </form>
    </div>
  </main>
</body>
<script src="/js/jquery-3.1.1.min.js"></script>
<script>function getAccessToken() {
    return localStorage.getItem('auth');
}
function ensureLogin() {
    if (!getAccessToken()) {
        window.location.href = '/auth/login';
    }
}
function logout() {
    localStorage.removeItem('auth');
    location.href = '/auth/login';
}
function parseQuery() {
  query = location.search.substring(1);
  var vars = query.split('&');
  var rs = {};
  for (var i = 0; i < vars.length; i++) {
    var pair = vars[i].split('=');
    rs[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
  }
  return rs;
}</script>
<script>ensureLogin();

var submit = false;
$('#submitBtn').on('click', function () {
  if (submit) {
    return ;
  }
  submit = true;
  var accessToken = getAccessToken();
  var oldPassword = $('#inputPassword').val();
  var newPassword = $('#inputNewPassword').val();
  $.ajax({
    type: 'patch',
    data: JSON.stringify({ oldPassword: oldPassword, newPassword: newPassword }),
    contentType: 'application/json;charset=utf-8',
    headers: {
      Authorization : 'Bearer ' + accessToken,
    },
    url: '/users/password',
    dataType: 'json',
    success: function (data) {
      if (data.status == "OK") {
        alert("change success");
        logout();
      } else if (data.status == 401) {
        alert('token invalid');
        logout();
      } else {
        alert(data.message);
      }
      submit = false;
    }
  });
});</script>

</html>
