<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · CodePush Server</title>
  <meta name="keywords" content="code-push-server,code-push,react-native,cordova">
  <meta name="description"
    content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  <script src="/html/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/html/css/theme.css">
</head>

<body class="min-h-screen bg-surface-dim text-onSurface antialiased">
  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Brand -->
      <div class="flex flex-col items-center mb-8">
        <div class="h-16 w-16 rounded-xl bg-primary-container text-primary-onContainer flex items-center justify-center shadow-m3-1">
          <span class="material-symbols-rounded" style="font-size:32px">rocket_launch</span>
        </div>
        <h1 class="mt-4 text-2xl font-medium text-onSurface">CodePush Server</h1>
      </div>

      <!-- Card -->
      <div class="bg-surface-containerLow rounded-xl shadow-m3-1 border border-outline-variant p-6 sm:p-8">
        <form class="form-signin" id="form" method="post">
          <h2 class="form-signin-heading text-xl font-medium text-onSurface mb-1">Please register</h2>
          <p class="text-sm text-onSurface-variant mb-6">Enter your email — we'll send a verification code.</p>

          <div class="form-group">
            <label class="block text-sm font-medium text-onSurface-variant mb-1.5" for="inputEmail">Email address</label>
            <input class="form-control m3-field" id="inputEmail" type="email" name="email" placeholder="Email address"
              required autofocus>
          </div>

          <p id="formError" role="alert" aria-live="polite" hidden class="mt-4 text-sm text-error"></p>
          <button class="btn m3-btn m3-btn-filled w-full mt-6 py-3" id="submitBtn" type="submit">Register</button>
        </form>
      </div>

      <p class="text-center text-sm text-onSurface-variant mt-6">
        Already have an account?
        <a href="/auth/login" class="font-medium text-primary hover:underline">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/jquery-3.1.1.min.js"></script>
  <script src="/html/js/auth.js"></script>
  <script src="/html/js/register.js"></script>
</body>

</html>
