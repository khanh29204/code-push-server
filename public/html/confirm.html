<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm · CodePush Server</title>
  <meta name="keywords" content="code-push-server,code-push,react-native,cordova">
  <meta name="description"
    content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  <script src="/html/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/html/css/theme.css">
</head>

<body class="min-h-screen bg-surface-dim text-onSurface antialiased">
  <div class="container min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Brand -->
      <div class="flex flex-col items-center mb-8">
        <div class="h-16 w-16 rounded-xl bg-primary-container text-primary-onContainer flex items-center justify-center shadow-m3-1">
          <span class="material-symbols-rounded" style="font-size:32px">rocket_launch</span>
        </div>
        <h1 class="mt-4 text-2xl font-medium text-onSurface">CodePush Server</h1>
      </div>

      <!-- Card -->
      <div class="bg-surface-containerLow rounded-xl shadow-m3-1 border border-outline-variant p-6 sm:p-8">
        <form class="form-signin" id="form" method="post">
          <h2 class="form-signin-heading text-xl font-medium text-onSurface mb-1">Confirm your token</h2>
          <p class="text-sm text-onSurface-variant mb-6">Enter the code we emailed you and create a password.</p>

          <div class="space-y-4">
            <div class="form-group">
              <label class="block text-sm font-medium text-onSurface-variant mb-1.5" for="inputEmail">Email address</label>
              <input class="form-control m3-field" id="inputEmail" type="email" name="email" placeholder="Email address" required>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-onSurface-variant mb-1.5" for="inputToken">Token</label>
              <input class="form-control m3-field" id="inputToken" type="text" name="token" placeholder="Token" required autofocus>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-onSurface-variant mb-1.5" for="inputPassword">Create password</label>
              <input class="form-control m3-field" id="inputPassword" type="password" name="password" placeholder="Password" minlength="6" maxlength="20" required>
            </div>
          </div>

          <p id="formError" role="alert" aria-live="polite" hidden class="mt-4 text-sm text-error"></p>
          <button class="btn m3-btn m3-btn-filled w-full mt-6 py-3" id="submitBtn" type="submit">Confirm</button>
        </form>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade bs-example-modal-sm fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4"
      id="myModal" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel">
      <div class="modal-dialog modal-md w-full max-w-sm">
        <div class="modal-content rounded-xl bg-surface-containerHigh shadow-m3-3 overflow-hidden">
          <div class="modal-body px-6 pt-6 pb-2 text-center">
            <div class="mx-auto h-12 w-12 rounded-full bg-primary-container text-primary-onContainer flex items-center justify-center mb-4">
              <span class="material-symbols-rounded" style="font-size:28px">check</span>
            </div>
            <h4 class="modal-title text-2xl font-normal text-onSurface" id="mySmallModalLabel">Registration complete</h4>
            <p class="mt-3 text-sm text-onSurface-variant">Your account is ready. Please proceed to login.</p>
          </div>
          <div class="modal-footer flex justify-end gap-2 px-6 py-4">
            <button class="btn m3-btn m3-btn-text" type="button" data-dismiss="modal">Close</button>
            <button class="btn m3-btn m3-btn-filled" id="okBtn" type="button" data-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/jquery-3.1.1.min.js"></script>
  <script src="/html/js/auth.js"></script>
  <script src="/html/js/confirm.js"></script>
</body>

</html>
