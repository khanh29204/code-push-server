<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm · CodePush Server</title>
  <meta name="keywords" content="code-push-server,code-push,react-native,cordova">
  <meta name="description"
    content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <div class="container min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Brand -->
      <div class="flex flex-col items-center mb-8">
        <div class="h-14 w-14 rounded-2xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-600/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v6" /><path d="M4.93 10.93 9 15" /><path d="M2 18h6" /><path d="M22 6h-6" />
            <path d="M15 9l4.07-4.07" /><circle cx="12" cy="18" r="4" />
          </svg>
        </div>
        <h1 class="mt-4 text-xl font-semibold text-slate-900">CodePush Server</h1>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8">
        <form class="form-signin" id="form" method="post">
          <h2 class="form-signin-heading text-lg font-semibold text-slate-900 mb-1">Confirm your token</h2>
          <p class="text-sm text-slate-500 mb-6">Enter the code we emailed you and create a password.</p>

          <div class="space-y-4">
            <div class="form-group">
              <label class="block text-sm font-medium text-slate-700 mb-1.5" for="inputEmail">Email address</label>
              <input
                class="form-control block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
                id="inputEmail" type="text" name="email" placeholder="Email address" required>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-slate-700 mb-1.5" for="inputToken">Token</label>
              <input
                class="form-control block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
                id="inputToken" type="text" name="token" placeholder="Token" required autofocus>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-slate-700 mb-1.5" for="inputPassword">Create password</label>
              <input
                class="form-control block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
                id="inputPassword" type="password" name="password" placeholder="Password" required>
            </div>
          </div>

          <a class="btn btn-lg btn-primary btn-block mt-6 inline-flex w-full cursor-pointer items-center justify-center rounded-lg bg-brand-600 px-4 py-2.5 font-medium text-white shadow-sm hover:bg-brand-700 focus:ring-2 focus:ring-brand-500/40 focus:outline-none transition"
            id="submitBtn">Confirm</a>
        </form>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade bs-example-modal-sm fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 px-4"
      id="myModal" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel">
      <div class="modal-dialog modal-md w-full max-w-sm">
        <div class="modal-content rounded-2xl bg-white shadow-xl overflow-hidden">
          <div class="modal-header flex items-center justify-between border-b border-slate-100 px-6 py-4">
            <h4 class="modal-title text-base font-semibold text-slate-900" id="mySmallModalLabel">Registration complete</h4>
            <button class="close text-slate-400 hover:text-slate-600 text-xl leading-none" data-dismiss="modal"
              aria-label="Close"><span aria-hidden="true">×</span></button>
          </div>
          <div class="modal-body px-6 py-5 text-sm text-slate-600">Your account is ready. Please proceed to login.</div>
          <div class="modal-footer flex justify-end gap-2 border-t border-slate-100 px-6 py-4">
            <button class="btn btn-default cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 transition"
              type="button" data-dismiss="modal">Close</button>
            <button class="btn btn-primary cursor-pointer rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700 transition"
              id="okBtn" type="button" data-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="/js/jquery-3.1.1.min.js"></script>
<script>function getAccessToken() {
    return localStorage.getItem('auth');
  }
  function ensureLogin() {
    if (!getAccessToken()) {
      window.location.href = '/auth/login';
    }
  }
  function logout() {
    localStorage.removeItem('auth');
    location.href = '/auth/login';
  }
  function parseQuery() {
    query = location.search.substring(1);
    var vars = query.split('&');
    var rs = {};
    for (var i = 0; i < vars.length; i++) {
      var pair = vars[i].split('=');
      rs[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
    }
    return rs;
  }</script>
<script>
  // Lightweight modal helpers (replaces Bootstrap JS)
  function showModal() { $('#myModal').removeClass('hidden').addClass('flex'); }
  function hideModal() { $('#myModal').removeClass('flex').addClass('hidden'); }
  $('[data-dismiss="modal"]').on('click', hideModal);

  // Prefill email from query string if present
  (function () {
    var q = parseQuery();
    if (q.email) { $('#inputEmail').val(q.email); }
  })();

  $('#okBtn').on('click', function () {
    location.href = '/auth/login?email=' + $('#inputEmail').val();
  });

  var submit = false;
  $('#submitBtn').on('click', function () {
    if (submit) {
      return;
    }
    console.log($('#form').serializeArray());
    submit = true;
    $.ajax({
      type: 'post',
      data: $('#form').serializeArray(),
      url: "/users/",
      dataType: 'json',
      success: function (data) {
        if (data.status == "OK") {
          showModal();
          submit = false;
        } else {
          alert(data.message);
          submit = false;
        }
      }
    });
  });</script>

</html>
