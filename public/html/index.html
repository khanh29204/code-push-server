<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodePush Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#6750A4', container: '#EADDFF', on: '#FFFFFF', onContainer: '#21005D' },
            secondary: { DEFAULT: '#625B71', container: '#E8DEF8', on: '#FFFFFF', onContainer: '#1D192B' },
            tertiary: { DEFAULT: '#7D5260', container: '#FFD8E4', on: '#FFFFFF', onContainer: '#31111D' },
            error: { DEFAULT: '#B3261E', container: '#F9DEDC', on: '#FFFFFF', onContainer: '#410E0B' },
            surface: {
              DEFAULT: '#FEF7FF', dim: '#DED8E1', bright: '#FEF7FF',
              container: '#F3EDF7', containerLow: '#F7F2FA', containerHigh: '#ECE6F0', containerHighest: '#E6E0E9',
              variant: '#E7E0EC', inverse: '#322F35'
            },
            onSurface: { DEFAULT: '#1D1B20', variant: '#49454F', inverse: '#F5EFF7' },
            outline: { DEFAULT: '#79747E', variant: '#CAC4D0' },
            // Backward-compatible alias so existing `brand-*` classes keep working.
            brand: { 50: '#EADDFF', 100: '#EADDFF', 200: '#D0BCFF', 500: '#6750A4', 600: '#6750A4', 700: '#4F378B' }
          },
          fontFamily: { sans: ['Roboto', 'Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'] },
          borderRadius: { sm: '0.5rem', DEFAULT: '0.75rem', lg: '1rem', xl: '1.75rem', '2xl': '1.75rem' },
          boxShadow: {
            'm3-1': '0 1px 2px 0 rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15)',
            'm3-2': '0 1px 2px 0 rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15)',
            'm3-3': '0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px 0 rgba(0,0,0,0.30)'
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Roboto', ui-sans-serif, system-ui, sans-serif; }
    .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; line-height: 1; vertical-align: middle; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #CAC4D0; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    /* M3 icon button with circular state layer */
    .m3-icon-btn {
      display: inline-flex; align-items: center; justify-content: center; height: 40px; width: 40px; border-radius: 9999px;
      color: #49454F; position: relative; overflow: hidden; transition: background-color .15s;
    }
    .m3-icon-btn:hover { background-color: rgba(29,27,32,.08); }
    .m3-icon-btn:active { background-color: rgba(29,27,32,.12); }
    /* M3 filled text field (used inside modals/prompts via .m3-field) */
    .m3-field {
      width: 100%; background-color: #E6E0E9; color: #1D1B20; border: 0; border-bottom: 1px solid #79747E;
      border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; padding: 0.625rem 0.875rem; font-size: 0.875rem;
      transition: background-color .15s, border-color .15s;
    }
    .m3-field::placeholder { color: #49454F; }
    .m3-field:hover { background-color: #E0DAE6; }
    .m3-field:focus { outline: none; border-bottom: 2px solid #6750A4; background-color: #ECE6F0; }
    select.m3-field { padding-right: 2rem; }
    /* M3 buttons */
    .m3-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      border-radius: 9999px; padding: .5rem 1.25rem; font-weight: 500; font-size: .875rem; letter-spacing: .01em;
      cursor: pointer; border: 0; transition: box-shadow .15s, background-color .15s; overflow: hidden; user-select: none;
    }
    .m3-btn::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
    .m3-btn:hover::after { opacity: .08; }
    .m3-btn:active::after { opacity: .12; }
    .m3-btn-filled { background-color: #6750A4; color: #fff; }
    .m3-btn-filled:hover { box-shadow: 0 1px 2px 0 rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15); }
    .m3-btn-tonal { background-color: #E8DEF8; color: #1D192B; }
    .m3-btn-outlined { background-color: transparent; color: #6750A4; border: 1px solid #79747E; }
    .m3-btn-text { background-color: transparent; color: #6750A4; }
  </style>
</head>

<body class="min-h-screen bg-surface-dim text-onSurface antialiased">
  <!-- Top app bar -->
  <header class="border-b border-outline-variant bg-surface/90 backdrop-blur sticky top-0 z-20">
    <div class="mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <button id="sidebarToggle" class="sm:hidden m3-icon-btn">
          <span class="material-symbols-rounded">menu</span>
        </button>
        <div class="h-10 w-10 rounded-lg bg-primary-container text-primary-onContainer flex items-center justify-center">
          <span class="material-symbols-rounded" style="font-size:22px">rocket_launch</span>
        </div>
        <span class="font-medium text-lg text-onSurface">CodePush Admin</span>
        <span id="accountBadge" class="hidden sm:inline-block ml-3 text-xs text-onSurface-variant truncate max-w-[120px]"></span>
      </div>
      <div class="flex items-center gap-1">
        <button id="langBtn" class="inline-flex items-center gap-1.5 m3-btn m3-btn-text" title="Change language">
          <span class="material-symbols-rounded" style="font-size:20px">language</span>
          <span id="langLabel">EN</span>
        </button>
        <a href="/tokens" class="m3-icon-btn" title="CLI token" data-i18n-title="cliToken">
          <span class="material-symbols-rounded" style="font-size:22px">key</span>
        </a>
        <a href="/auth/password" class="m3-icon-btn" title="Password" data-i18n-title="password">
          <span class="material-symbols-rounded" style="font-size:22px">lock</span>
        </a>
        <button id="logoutBtn" class="m3-icon-btn" title="Logout" data-i18n-title="logout">
          <span class="material-symbols-rounded" style="font-size:22px">logout</span>
        </button>
      </div>
    </div>
  </header>

  <div class="mx-auto flex relative" style="height:calc(100vh - 4rem)">
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-20 hidden sm:hidden"></div>
    <!-- Navigation drawer -->
    <aside id="sidebar" class="fixed sm:relative top-16 sm:top-auto left-0 bottom-0 w-72 shrink-0 border-r border-outline-variant bg-surface flex flex-col z-30 -translate-x-full sm:translate-x-0 transition-transform duration-200" style="height:calc(100vh - 4rem)">
      <div class="px-4 pt-4 pb-2 flex items-center justify-between">
        <h2 class="text-xs font-medium uppercase tracking-wider text-onSurface-variant" data-i18n="applications">Applications</h2>
        <button id="newAppBtn" data-i18n-title="createApp" title="Create app" class="m3-icon-btn h-8 w-8">
          <span class="material-symbols-rounded" style="font-size:20px">add</span>
        </button>
      </div>
      <div id="appList" class="px-2 flex-1 overflow-y-auto scrollbar-thin space-y-0.5 pb-3">
        <div class="text-center text-xs text-onSurface-variant py-6" data-i18n="loading">Loading...</div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 min-w-0 flex flex-col">
      <!-- Deployment tabs -->
      <div class="border-b border-outline-variant bg-surface px-4 sm:px-6 pt-4">
        <div class="flex items-start justify-between gap-2 mb-3 flex-wrap">
          <div class="min-w-0">
            <h1 id="currentAppTitle" class="text-xl font-normal text-onSurface truncate" data-i18n="noAppSelected">No app selected</h1>
            <p id="currentAppMeta" class="text-xs text-onSurface-variant mt-0.5"></p>
          </div>
          <div id="appActions" class="hidden flex items-center gap-2 shrink-0">
            <button id="renameAppBtn" class="m3-btn m3-btn-outlined text-xs py-1.5 px-3">
              <span class="material-symbols-rounded" style="font-size:16px">edit</span>
              <span data-i18n="rename">Rename</span>
            </button>
            <button id="deleteAppBtn" class="m3-btn m3-btn-outlined text-xs py-1.5 px-3" style="color:#B3261E;border-color:#B3261E">
              <span class="material-symbols-rounded" style="font-size:16px">delete</span>
              <span data-i18n="deleteApp">Delete app</span>
            </button>
          </div>
        </div>
        <div id="deploymentTabs" class="flex items-end gap-1 -mb-px overflow-x-auto scrollbar-thin"></div>
      </div>

      <!-- Toolbar -->
      <div id="toolbar" class="hidden border-b border-outline-variant bg-surface px-4 py-3 flex flex-col sm:flex-row items-start sm:items-center gap-2">
        <div class="flex items-center gap-2 flex-wrap min-w-0">
          <div class="text-sm min-w-0">
            <span class="text-onSurface-variant" data-i18n="deploymentKey">Deployment key:</span>
            <code id="depKey" class="ml-1 rounded bg-surface-containerHighest px-2 py-0.5 text-xs font-mono text-onSurface break-all"></code>
            <button id="copyKeyBtn" class="ml-1 text-xs text-primary hover:underline" data-i18n="copy">Copy</button>
          </div>
        </div>
        <div class="flex items-center gap-1.5 flex-wrap">
          <label class="text-xs text-onSurface-variant" data-i18n="historyLimit">History limit</label>
          <select id="historyLimit" class="text-xs rounded-md border border-outline bg-surface px-2 py-1">
            <option value="15">15</option>
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="500">500</option>
          </select>
          <button id="refreshBtn" class="m3-btn m3-btn-tonal text-xs py-1.5 px-3">
            <span class="material-symbols-rounded" style="font-size:16px">refresh</span>
            <span data-i18n="refresh">Refresh</span>
          </button>
          <button id="promoteBtn" class="m3-btn m3-btn-tonal text-xs py-1.5 px-3">
            <span class="material-symbols-rounded" style="font-size:16px">north_east</span>
            <span data-i18n="promote">Promote</span>
          </button>
          <button id="rollbackLatestBtn" class="m3-btn m3-btn-outlined text-xs py-1.5 px-3" style="color:#7D5260;border-color:#7D5260">
            <span class="material-symbols-rounded" style="font-size:16px">undo</span>
            <span data-i18n="rollbackLatest">Rollback latest</span>
          </button>
          <button id="clearHistoryBtn" class="m3-btn m3-btn-outlined text-xs py-1.5 px-3" style="color:#B3261E;border-color:#B3261E">
            <span class="material-symbols-rounded" style="font-size:16px">delete_sweep</span>
            <span data-i18n="clearHistory">Clear history</span>
          </button>
          <button id="renameDepBtn" class="m3-btn m3-btn-text text-xs py-1.5 px-3" data-i18n="rename">Rename</button>
          <button id="deleteDepBtn" class="m3-btn m3-btn-text text-xs py-1.5 px-3" style="color:#B3261E" data-i18n="deleteDeployment">Delete deployment</button>
        </div>
      </div>

      <!-- History table -->
      <div class="flex-1 overflow-auto scrollbar-thin bg-surface-dim p-3 sm:p-6">
        <div id="emptyState" class="hidden flex flex-col items-center justify-center h-full text-onSurface-variant">
          <span class="material-symbols-rounded mb-3 text-outline" style="font-size:56px">inbox</span>
          <p class="text-sm" data-i18n="emptySelect">Select an app and deployment to view releases.</p>
        </div>
        <div id="tableWrap" class="hidden bg-surface rounded-xl border border-outline-variant shadow-m3-1 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-surface-variant border-b border-outline-variant text-onSurface-variant">
                <tr>
                  <th class="text-left font-medium px-3 py-2.5" data-i18n="thLabel">Label</th>
                  <th class="text-left font-medium px-3 py-2.5" data-i18n="thAppVersion">App version</th>
                  <th class="text-left font-medium px-3 py-2.5" data-i18n="thDescription">Description</th>
                  <th class="text-left font-medium px-3 py-2.5" data-i18n="thReleased">Released</th>
                  <th class="text-right font-medium px-3 py-2.5" data-i18n="thRollout">Rollout</th>
                  <th class="text-center font-medium px-3 py-2.5" data-i18n="thFlags">Flags</th>
                  <th class="text-right font-medium px-3 py-2.5" data-i18n="thSize">Size</th>
                  <th class="text-right font-medium px-3 py-2.5" data-i18n-title="metricsTooltip" title="active / installed / downloaded / failed" data-i18n="thMetrics">Metrics</th>
                  <th class="text-right font-medium px-3 py-2.5" data-i18n="thActions">Actions</th>
                </tr>
              </thead>
              <tbody id="historyBody" class="divide-y divide-outline-variant"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal container -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toastRoot" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <script>
    // ------------------------ i18n ------------------------
    const I18N = {

        cliToken: 'CLI token',

        renameDeployment: 'Rename deployment',
        createDeploymentTitle: 'Create deployment',
        deploymentName: 'Deployment name',
        deleteDeploymentConfirm: (n) => `Delete "${n}" and all its releases?`,
        clearHistoryConfirm: (n) => `Delete ALL release history of "${n}"? Clients cannot roll back after this.`,
        rollbackLatestConfirm: (n) => `Rollback the latest release on "${n}" to the previous version?`,
        promoteTitle: (src) => `Promote from "${src}"`,

        flagMandatory: 'MANDATORY',

        applications: 'Ứng dụng',
        createApp: 'Tạo ứng dụng',
        loading: 'Đang tải...',
        noAppSelected: 'Chưa chọn ứng dụng',
        rename: 'Đổi tên',
        deleteApp: 'Xoá ứng dụng',
        deploymentKey: 'Deployment key:',
        copy: 'Sao chép',
        historyLimit: 'Số bản ghi',
        refresh: 'Làm mới',
        promote: 'Promote',
        rollbackLatest: 'Rollback bản mới nhất',
        clearHistory: 'Xoá lịch sử',
        deleteDeployment: 'Xoá deployment',
        emptySelect: 'Chọn một ứng dụng và deployment để xem các bản phát hành.',
        thLabel: 'Nhãn',
        thAppVersion: 'Phiên bản app',
        thDescription: 'Mô tả',
        thReleased: 'Phát hành',

        edit: 'Sửa',
        rollback: 'Rollback',
        del: 'Xoá',
        cancel: 'Huỷ',
        save: 'Lưu',
        create: 'Tạo',
        confirm: 'Xác nhận',
        createAppTitle: 'Tạo ứng dụng',
        appName: 'Tên ứng dụng',
        os: 'Hệ điều hành',
        platform: 'Nền tảng',
        renameApp: 'Đổi tên ứng dụng',
        newName: 'Tên mới',
        deleteAppConfirm: (n) => `Xoá "${n}" và TẤT CẢ deployments/releases của nó? Không thể khôi phục.`,
        renameDeployment: 'Đổi tên deployment',
        createDeploymentTitle: 'Tạo deployment',
        deploymentName: 'Tên deployment',
        deleteDeploymentConfirm: (n) => `Xoá "${n}" và toàn bộ bản phát hành trong đó?`,
        clearHistoryConfirm: (n) => `Xoá TOÀN BỘ lịch sử phát hành của "${n}"? Client sẽ không thể rollback sau thao tác này.`,
        rollbackLatestConfirm: (n) => `Rollback bản phát hành mới nhất trên "${n}" về bản trước đó?`,
        promoteTitle: (src) => `Promote từ "${src}"`,
        destDeployment: 'Deployment đích',
        descOverride: 'Ghi đè mô tả (không bắt buộc)',
        rolloutPct: 'Rollout %',
        mandatory: 'Bắt buộc cập nhật',
        disabled: 'Vô hiệu (ẩn khỏi client)',
        description: 'Mô tả',
        editRelease: (l) => `Sửa bản phát hành ${l}`,
        rollbackConfirm: (n, l) => `Rollback "${n}" về nhãn ${l}? Một bản phát hành mới sẽ được tạo trỏ tới gói của nhãn này.`,
        deleteRelease: 'Xoá bản phát hành',
        deleteReleaseConfirm: (l) => `Xoá bản phát hành ${l}? Client đã cài rồi sẽ không bị ảnh hưởng, nhưng nó sẽ biến mất khỏi lịch sử.`,
        noOtherDep: 'Không có deployment nào khác để promote',
        appCreated: 'Đã tạo ứng dụng',
        renamed: 'Đã đổi tên',
        appDeleted: 'Đã xoá ứng dụng',
        deploymentCreated: 'Đã tạo deployment',
        deleted: 'Đã xoá',
        historyCleared: 'Đã xoá lịch sử',
        rolledBack: 'Đã rollback',
        promoted: 'Đã promote',
        updated: 'Đã cập nhật',
        keyCopied: 'Đã sao chép deployment key',
        flagMandatory: 'BẮT BUỘC',
        flagDisabled: 'VÔ HIỆU',
        flagRollout: (n) => `ROLLOUT ${n}%`,
      }
    };

    let currentLang = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().startsWith('vi') ? 'vi' : 'en');
    function t(key, ...args) {
      const dict = I18N[currentLang] || I18N.en;
      const v = dict[key] ?? I18N.en[key] ?? key;
      return typeof v === 'function' ? v(...args) : v;
    }
    function applyI18n(root = document) {
      root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
      root.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
    }
    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;
      document.getElementById('langLabel').textContent = lang === 'vi' ? 'VI' : 'EN';
      applyI18n();
      // Re-render dynamic bits
      renderAppList();
      renderDeploymentTabs();
      renderHistory();
    }

    // ------------------------ Utilities ------------------------
    const state = {
      apps: [],
      currentApp: null,
      deployments: [],
      currentDeployment: null,
      history: [],
      metrics: {},
    };

    const token = () => localStorage.getItem('auth');
    if (!token()) location.href = '/auth/login';

    function toast(msg, kind = 'info') {
      const el = document.createElement('div');
      const colors = {
        info: 'bg-surface-inverse text-onSurface-inverse',
        success: 'bg-[#1E4620] text-white',
        error: 'bg-error text-error-on',
      };
      el.className = `rounded-lg shadow-m3-3 px-4 py-3 text-sm ${colors[kind] || colors.info} animate-in`;
      el.textContent = msg;
      document.getElementById('toastRoot').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    async function api(method, path, body, opts = {}) {
      const headers = { 'Authorization': 'Bearer ' + token() };
      let payload;
      if (body !== undefined && body !== null) {
        if (opts.form) {
          const fd = new URLSearchParams();
          for (const k in body) fd.append(k, body[k]);
          payload = fd.toString();
          headers['Content-Type'] = 'application/x-www-form-urlencoded';
        } else {
          headers['Content-Type'] = 'application/json';
          payload = JSON.stringify(body);
        }
      }
      const res = await fetch(path, { method, headers, body: payload });
      if (res.status === 401) {
        localStorage.removeItem('auth');
        location.href = '/auth/login';
        throw new Error('Unauthorized');
      }
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) {
        const msg = (data && (data.message || data.error)) || text || `HTTP ${res.status}`;
        throw new Error(msg);
      }
      return data;
    }

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function fmtTime(ms) {
      if (!ms) return '—';
      const d = new Date(ms);
      return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function fmtBytes(n) {
      if (!n && n !== 0) return '—';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
      return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ------------------------ Modal ------------------------
    function modal({ title, body, actions }) {
      return new Promise((resolve) => {
        const root = document.getElementById('modalRoot');
        const backdrop = document.createElement('div');
        backdrop.className = 'fixed inset-0 z-40 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4';
        backdrop.innerHTML = `
          <div class="w-full max-w-lg bg-surface-containerHigh rounded-xl shadow-m3-3 overflow-hidden">
            <div class="px-6 py-4 flex items-center justify-between">
              <h3 class="text-xl font-normal text-onSurface">${escapeHtml(title)}</h3>
              <button data-close class="m3-icon-btn h-9 w-9"><span class="material-symbols-rounded" style="font-size:20px">close</span></button>
            </div>
            <div class="px-6 py-2 max-h-[70vh] overflow-y-auto scrollbar-thin" data-body></div>
            <div class="px-6 py-4 flex justify-end gap-2" data-actions></div>
          </div>`;
        const bodyEl = backdrop.querySelector('[data-body]');
        const actionsEl = backdrop.querySelector('[data-actions]');
        if (typeof body === 'string') bodyEl.innerHTML = body;
        else bodyEl.appendChild(body);

        function close(val) { backdrop.remove(); resolve(val); }
        backdrop.querySelector('[data-close]').onclick = () => close(null);
        backdrop.addEventListener('click', e => { if (e.target === backdrop) close(null); });

        (actions || [{ label: 'Close', kind: 'secondary', value: null }]).forEach(a => {
          const btn = document.createElement('button');
          const base = 'm3-btn';
          const styles = {
            primary: 'm3-btn-filled',
            secondary: 'm3-btn-text',
            danger: 'm3-btn-filled',
          };
          btn.className = base + ' ' + (styles[a.kind] || styles.secondary);
          if (a.kind === 'danger') btn.style.backgroundColor = '#B3261E';
          btn.textContent = a.label;
          btn.onclick = async () => {
            if (a.onClick) {
              try {
                const r = await a.onClick(bodyEl);
                if (r !== false) close(a.value !== undefined ? a.value : true);
              } catch (e) { toast(e.message, 'error'); }
            } else close(a.value !== undefined ? a.value : true);
          };
          actionsEl.appendChild(btn);
        });

        root.appendChild(backdrop);
        const firstInput = bodyEl.querySelector('input,textarea,select');
        if (firstInput) firstInput.focus();
      });
    }

    function prompt2(title, fields, submitLabel = 'Save') {
      return new Promise((resolve) => {
        const form = document.createElement('form');
        form.className = 'space-y-3';
        fields.forEach(f => {
          const wrap = document.createElement('div');
          const label = `<label class="block text-xs font-medium text-onSurface-variant mb-1">${escapeHtml(f.label)}</label>`;
          let input = '';
          if (f.type === 'textarea') {
            input = `<textarea name="${f.name}" rows="3" class="m3-field">${escapeHtml(f.value ?? '')}</textarea>`;
          } else if (f.type === 'checkbox') {
            input = `<label class="inline-flex items-center gap-2 text-sm text-onSurface"><input type="checkbox" name="${f.name}" ${f.value ? 'checked' : ''} class="rounded border-outline text-primary focus:ring-primary/30 accent-primary"> ${escapeHtml(f.checkboxLabel || '')}</label>`;
          } else if (f.type === 'select') {
            input = `<select name="${f.name}" class="m3-field">${
              (f.options || []).map(o => `<option value="${escapeHtml(o.value)}" ${o.value == f.value ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')
            }</select>`;
          } else if (f.type === 'number' || f.type === 'range') {
            input = `<input type="${f.type}" name="${f.name}" value="${escapeHtml(f.value ?? '')}" min="${f.min ?? ''}" max="${f.max ?? ''}" step="${f.step ?? ''}" class="m3-field">`;
          } else {
            input = `<input type="text" name="${f.name}" value="${escapeHtml(f.value ?? '')}" placeholder="${escapeHtml(f.placeholder || '')}" class="m3-field">`;
          }
          wrap.innerHTML = f.type === 'checkbox' ? input : label + input + (f.hint ? `<p class="mt-1 text-xs text-onSurface-variant">${escapeHtml(f.hint)}</p>` : '');
          form.appendChild(wrap);
        });

        modal({
          title,
          body: form,
          actions: [
            { label: 'Cancel', kind: 'secondary', value: null },
            {
              label: submitLabel, kind: 'primary', onClick: () => {
                const out = {};
                fields.forEach(f => {
                  const el = form.elements[f.name];
                  if (!el) return;
                  if (f.type === 'checkbox') out[f.name] = el.checked;
                  else if (f.type === 'number' || f.type === 'range') out[f.name] = el.value === '' ? null : Number(el.value);
                  else out[f.name] = el.value;
                });
                resolve(out);
              }
            }
          ]
        }).then(v => { if (v === null) resolve(null); });
      });
    }

    function confirm2(title, msg, danger = true) {
      return modal({
        title,
        body: `<p class="text-sm text-onSurface-variant">${escapeHtml(msg)}</p>`,
        actions: [
          { label: 'Cancel', kind: 'secondary', value: false },
          { label: 'Confirm', kind: danger ? 'danger' : 'primary', value: true },
        ]
      });
    }

    // ------------------------ Data loading ------------------------
    async function loadApps() {
      const data = await api('GET', '/apps');
      state.apps = data.apps || [];
      renderAppList();
    }

    async function loadDeployments(appName) {
      const data = await api('GET', `/apps/${encodeURIComponent(appName)}/deployments`);
      state.deployments = data.deployments || [];
      renderDeploymentTabs();
    }

    async function loadHistory() {
      const app = state.currentApp, dep = state.currentDeployment;
      if (!app || !dep) return;
      const limit = document.getElementById('historyLimit').value || 100;
      const [hist, met] = await Promise.all([
        api('GET', `/apps/${encodeURIComponent(app.name)}/deployments/${encodeURIComponent(dep.name)}/history?limit=${limit}`),
        api('GET', `/apps/${encodeURIComponent(app.name)}/deployments/${encodeURIComponent(dep.name)}/metrics`).catch(() => ({ metrics: {} })),
      ]);
      state.history = hist.history || [];
      state.metrics = met.metrics || {};
      renderHistory();
    }

    // ------------------------ Rendering ------------------------
    function renderAppList() {
      const list = document.getElementById('appList');
      if (!state.apps.length) {
        list.innerHTML = `<div class="text-center text-xs text-onSurface-variant py-6">${t('noApps')}<br><button id="createFirstApp" class="mt-2 text-primary hover:underline">${t('createOne')}</button></div>`;
        document.getElementById('createFirstApp')?.addEventListener('click', createApp);
        return;
      }
      list.innerHTML = state.apps.map(a => {
        const active = state.currentApp && state.currentApp.name === a.name;
        return `<button data-app="${escapeHtml(a.name)}" class="w-full flex items-center justify-between text-left rounded-full px-4 py-2.5 text-sm transition ${active ? 'bg-secondary-container text-secondary-onContainer font-medium' : 'text-onSurface-variant hover:bg-surface-containerHigh'}">
          <span class="truncate">${escapeHtml(a.name)}</span>
          ${a.os ? `<span class="ml-2 text-[10px] uppercase tracking-wide text-outline">${escapeHtml(a.os)}</span>` : ''}
        </button>`;
      }).join('');
      list.querySelectorAll('[data-app]').forEach(b => b.onclick = () => selectApp(b.dataset.app));
    }

    function renderDeploymentTabs() {
      const tabs = document.getElementById('deploymentTabs');
      document.getElementById('appActions').classList.toggle('hidden', !state.currentApp);
      if (!state.currentApp) { tabs.innerHTML = ''; return; }
      document.getElementById('currentAppTitle').textContent = state.currentApp.name;
      document.getElementById('currentAppMeta').textContent = [state.currentApp.os, state.currentApp.platform].filter(Boolean).join(' · ');
      if (!state.deployments.length) {
        tabs.innerHTML = `<button id="newDepBtnEmpty" class="rounded-full border border-dashed border-outline px-4 py-1.5 text-xs text-onSurface-variant hover:border-primary hover:text-primary">${t('createDeployment')}</button>`;
        document.getElementById('newDepBtnEmpty').onclick = createDeployment;
        document.getElementById('toolbar').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('tableWrap').classList.add('hidden');
        return;
      }
      tabs.innerHTML = state.deployments.map(d => {
        const active = state.currentDeployment && state.currentDeployment.name === d.name;
        return `<button data-dep="${escapeHtml(d.name)}" class="px-4 py-2.5 text-sm border-b-2 -mb-px transition ${active ? 'border-primary text-primary font-medium' : 'border-transparent text-onSurface-variant hover:text-onSurface'}">${escapeHtml(d.name)}</button>`;
      }).join('') + `<button id="newDepBtnInline" class="ml-2 m3-icon-btn h-9 w-9" title="${t('createDeployment')}"><span class="material-symbols-rounded" style="font-size:20px">add</span></button>`;
      tabs.querySelectorAll('[data-dep]').forEach(b => b.onclick = () => selectDeployment(b.dataset.dep));
      document.getElementById('newDepBtnInline').onclick = createDeployment;
    }

    function flagBadge(label, on, color) {
      if (!on) return '';
      const map = {
        red: 'bg-error-container text-error-onContainer border-error-container',
        amber: 'bg-tertiary-container text-tertiary-onContainer border-tertiary-container',
        slate: 'bg-secondary-container text-secondary-onContainer border-secondary-container',
      };
      return `<span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[10px] font-medium ${map[color]}">${escapeHtml(label)}</span>`;
    }

    function renderHistory() {
      const wrap = document.getElementById('tableWrap');
      const empty = document.getElementById('emptyState');
      const toolbar = document.getElementById('toolbar');
      if (!state.currentDeployment) { wrap.classList.add('hidden'); empty.classList.remove('hidden'); toolbar.classList.add('hidden'); return; }
      toolbar.classList.remove('hidden');
      document.getElementById('depKey').textContent = state.currentDeployment.key || '';
      if (!state.history.length) {
        wrap.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.querySelector('p').textContent = t('emptyReleases');
        return;
      }
      empty.classList.add('hidden');
      wrap.classList.remove('hidden');
      const rows = state.history.slice().sort((a, b) => (b.uploadTime || 0) - (a.uploadTime || 0)).map(p => {
        const m = state.metrics[p.label] || {};
        const flags = [
          flagBadge(t('flagMandatory'), p.isMandatory, 'red'),
          flagBadge(t('flagDisabled'), p.isDisabled, 'slate'),
          (p.rollout != null && p.rollout < 100) ? flagBadge(t('flagRollout', p.rollout), true, 'amber') : '',
          p.releaseMethod && p.releaseMethod !== 'Upload' ? flagBadge(p.releaseMethod.toUpperCase(), true, 'slate') : '',
        ].filter(Boolean).join(' ');
        const metrics = `<span class="text-[#1E4620] font-medium">${m.active ?? 0}</span> / <span>${m.installed ?? 0}</span> / <span class="text-onSurface-variant">${m.downloaded ?? 0}</span> / <span class="text-error">${m.failed ?? 0}</span>`;
        return `<tr class="hover:bg-surface-containerHigh/60">
          <td class="px-3 py-2.5 font-mono text-xs font-semibold text-onSurface">${escapeHtml(p.label)}</td>
          <td class="px-3 py-2.5 text-xs text-onSurface-variant">${escapeHtml(p.appVersion || '')}</td>
          <td class="px-3 py-2.5 text-xs text-onSurface-variant max-w-xs truncate" title="${escapeHtml(p.description || '')}">${escapeHtml(p.description || '')}</td>
          <td class="px-3 py-2.5 text-xs text-onSurface-variant" title="${new Date(p.uploadTime || 0).toString()}">
            <div>${fmtTime(p.uploadTime)}</div>
            <div class="text-[10px] text-outline">${escapeHtml(p.releasedBy || '')}</div>
          </td>
          <td class="px-3 py-2.5 text-xs text-right text-onSurface-variant">${p.rollout != null ? p.rollout + '%' : '—'}</td>
          <td class="px-3 py-2.5 text-center space-x-1">${flags || '<span class="text-outline-variant">—</span>'}</td>
          <td class="px-3 py-2.5 text-xs text-right text-onSurface-variant">${fmtBytes(p.size)}</td>
          <td class="px-3 py-2.5 text-xs text-right font-mono">${metrics}</td>
          <td class="px-3 py-2.5 text-right whitespace-nowrap">
            <button data-act="edit" data-label="${escapeHtml(p.label)}" class="text-xs text-primary hover:underline">${t('edit')}</button>
            <button data-act="rollback" data-label="${escapeHtml(p.label)}" class="ml-2 text-xs text-tertiary hover:underline">${t('rollback')}</button>
            <button data-act="delete" data-label="${escapeHtml(p.label)}" class="ml-2 text-xs text-error hover:underline">${t('del')}</button>
          </td>
        </tr>`;
      }).join('');
      document.getElementById('historyBody').innerHTML = rows;
      document.querySelectorAll('#historyBody [data-act]').forEach(b => {
        b.onclick = () => handleReleaseAction(b.dataset.act, b.dataset.label);
      });
    }

    // ------------------------ Selection ------------------------
    async function selectApp(name) {
      const app = state.apps.find(a => a.name === name);
      if (!app) return;
      state.currentApp = app;
      state.currentDeployment = null;
      state.history = [];
      state.metrics = {};
      renderAppList();
      renderDeploymentTabs();
      try {
        await loadDeployments(name);
        if (state.deployments.length) {
          const preferred = state.deployments.find(d => d.name === 'Production') || state.deployments[0];
          await selectDeployment(preferred.name);
        }
      } catch (e) { toast(e.message, 'error'); }
    }

    async function selectDeployment(name) {
      const dep = state.deployments.find(d => d.name === name);
      if (!dep) return;
      state.currentDeployment = dep;
      renderDeploymentTabs();
      try { await loadHistory(); } catch (e) { toast(e.message, 'error'); }
    }

    // ------------------------ Actions: app / deployment ------------------------
    async function createApp() {
      const v = await prompt2(t('createAppTitle'), [
        { name: 'name', label: t('appName'), placeholder: 'MyApp' },
        { name: 'os', label: t('os'), type: 'select', options: [
          { value: 'android', label: 'android' }, { value: 'ios', label: 'ios' }, { value: 'windows', label: 'windows' },
        ], value: 'android' },
        { name: 'platform', label: t('platform'), type: 'select', options: [
          { value: 'react-native', label: 'react-native' }, { value: 'cordova', label: 'cordova' },
        ], value: 'react-native' },
      ], t('create'));
      if (!v || !v.name) return;
      try {
        await api('POST', '/apps', v);
        toast(t('appCreated'), 'success');
        await loadApps();
        await selectApp(v.name);
      } catch (e) { toast(e.message, 'error'); }
    }

    async function renameApp() {
      if (!state.currentApp) return;
      const v = await prompt2(t('renameApp'), [{ name: 'name', label: t('newName'), value: state.currentApp.name }], t('rename'));
      if (!v || !v.name || v.name === state.currentApp.name) return;
      try {
        await api('PATCH', `/apps/${encodeURIComponent(state.currentApp.name)}`, { name: v.name });
        toast(t('renamed'), 'success');
        state.currentApp = { ...state.currentApp, name: v.name };
        await loadApps();
        await selectApp(v.name);
      } catch (e) { toast(e.message, 'error'); }
    }

    async function deleteApp() {
      if (!state.currentApp) return;
      const ok = await confirm2(t('deleteApp'), t('deleteAppConfirm', state.currentApp.name));
      if (!ok) return;
      try {
        await api('DELETE', `/apps/${encodeURIComponent(state.currentApp.name)}`);
        toast(t('appDeleted'), 'success');
        state.currentApp = null;
        state.currentDeployment = null;
        state.deployments = [];
        await loadApps();
        renderDeploymentTabs();
        renderHistory();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function createDeployment() {
      if (!state.currentApp) return;
      const v = await prompt2(t('createDeploymentTitle'), [{ name: 'name', label: t('deploymentName'), placeholder: 'Staging' }], t('create'));
      if (!v || !v.name) return;
      try {
        await api('POST', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments`, { name: v.name });
        toast(t('deploymentCreated'), 'success');
        await loadDeployments(state.currentApp.name);
        await selectDeployment(v.name);
      } catch (e) { toast(e.message, 'error'); }
    }

    async function renameDeployment() {
      if (!state.currentDeployment) return;
      const v = await prompt2(t('renameDeployment'), [{ name: 'name', label: t('newName'), value: state.currentDeployment.name }], t('rename'));
      if (!v || !v.name || v.name === state.currentDeployment.name) return;
      try {
        await api('PATCH', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}`, { name: v.name });
        toast(t('renamed'), 'success');
        await loadDeployments(state.currentApp.name);
        await selectDeployment(v.name);
      } catch (e) { toast(e.message, 'error'); }
    }

    async function deleteDeployment() {
      if (!state.currentDeployment) return;
      const ok = await confirm2(t('deleteDeployment'), t('deleteDeploymentConfirm', state.currentDeployment.name));
      if (!ok) return;
      try {
        await api('DELETE', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}`);
        toast(t('deleted'), 'success');
        state.currentDeployment = null;
        await loadDeployments(state.currentApp.name);
        if (state.deployments.length) await selectDeployment(state.deployments[0].name);
        else renderHistory();
      } catch (e) { toast(e.message, 'error'); }

    async function clearHistory() {
      if (!state.currentDeployment) return;
      const ok = await confirm2(t('clearHistory'), t('clearHistoryConfirm', state.currentDeployment.name));
      if (!ok) return;
      try {
        await api('DELETE', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}/history`);
        toast(t('historyCleared'), 'success');
        await loadHistory();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function rollbackLatest() {
      if (!state.currentDeployment) return;
      const ok = await confirm2(t('rollbackLatest'), t('rollbackLatestConfirm', state.currentDeployment.name));
      if (!ok) return;
      try {
        await api('POST', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}/rollback`);
        toast(t('rolledBack'), 'success');
        await loadHistory();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function promotePackage() {
      if (!state.currentDeployment) return;
      const others = state.deployments.filter(d => d.name !== state.currentDeployment.name);
      if (!others.length) return toast(t('noOtherDep'), 'error');
      const v = await prompt2(t('promoteTitle', state.currentDeployment.name), [
        { name: 'dest', label: t('destDeployment'), type: 'select', options: others.map(d => ({ value: d.name, label: d.name })) },
        { name: 'description', label: t('descOverride'), type: 'textarea' },
        { name: 'rollout', label: t('rolloutPct'), type: 'number', min: 1, max: 100, value: 100 },
        { name: 'isMandatory', type: 'checkbox', checkboxLabel: t('mandatory') },
      ], t('promote'));
      if (!v) return;
      const body = { packageInfo: { rollout: v.rollout ?? 100, isMandatory: !!v.isMandatory } };
      if (v.description) body.packageInfo.description = v.description;
      try {
        await api('POST', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}/promote/${encodeURIComponent(v.dest)}`, body);
        toast(t('promoted'), 'success');
        await loadHistory();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function handleReleaseAction(act, label) {
      const p = state.history.find(x => x.label === label);
      if (!p) return;
      if (act === 'edit') {
        const v = await prompt2(t('editRelease', label), [
          { name: 'description', label: t('description'), type: 'textarea', value: p.description || '' },
          { name: 'rollout', label: t('rolloutPct'), type: 'number', min: 1, max: 100, value: p.rollout ?? 100 },
          { name: 'isMandatory', type: 'checkbox', checkboxLabel: t('mandatory'), value: !!p.isMandatory },
          { name: 'isDisabled', type: 'checkbox', checkboxLabel: t('disabled'), value: !!p.isDisabled },
        ], t('save'));
        if (!v) return;
        const body = {
          packageInfo: {
            label: label,
            description: v.description,
            rollout: v.rollout,
            isMandatory: !!v.isMandatory,
            isDisabled: !!v.isDisabled,
          }
        };
        try {
          await api('PATCH', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}/release`, body);
          toast(t('updated'), 'success');
          await loadHistory();
        } catch (e) { toast(e.message, 'error'); }
      } else if (act === 'rollback') {
        const ok = await confirm2(t('rollback'), t('rollbackConfirm', state.currentDeployment.name, label));
        if (!ok) return;
        try {
          await api('POST', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}/rollback/${encodeURIComponent(label)}`);
          toast(t('rolledBack'), 'success');
          await loadHistory();
        } catch (e) { toast(e.message, 'error'); }
      } else if (act === 'delete') {
        const ok = await confirm2(t('deleteRelease'), t('deleteReleaseConfirm', label));
        if (!ok) return;
        try {
          await api('DELETE', `/apps/${encodeURIComponent(state.currentApp.name)}/deployments/${encodeURIComponent(state.currentDeployment.name)}/releases/${encodeURIComponent(label)}`);
          toast(t('deleted'), 'success');
          await loadHistory();
        } catch (e) { toast(e.message, 'error'); }
      }
    }

      const overlay = document.getElementById('sidebarOverlay');
      document.getElementById('sidebarToggle').addEventListener('click', () => {
        const open = !sidebar.classList.contains('-translate-x-full');
        sidebar.classList.toggle('-translate-x-full', open);
        overlay.classList.toggle('hidden', open);
      });
      overlay.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      });
      document.getElementById('appList').addEventListener('click', () => {
        if (window.innerWidth < 640) {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
        }
      });
    })();

    document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('auth'); location.href = '/auth/login'; };
    document.getElementById('langBtn').onclick = () => setLang(currentLang === 'vi' ? 'en' : 'vi');
    document.getElementById('newAppBtn').onclick = createApp;
    document.getElementById('renameAppBtn').onclick = renameApp;
    document.getElementById('deleteAppBtn').onclick = deleteApp;
    document.getElementById('refreshBtn').onclick = () => loadHistory().catch(e => toast(e.message, 'error'));
    document.getElementById('historyLimit').onchange = () => loadHistory().catch(e => toast(e.message, 'error'));
    document.getElementById('promoteBtn').onclick = promotePackage;
    document.getElementById('rollbackLatestBtn').onclick = rollbackLatest;
    document.getElementById('clearHistoryBtn').onclick = clearHistory;
    document.getElementById('renameDepBtn').onclick = renameDeployment;
    document.getElementById('deleteDepBtn').onclick = deleteDeployment;
    document.getElementById('copyKeyBtn').onclick = () => {
      const key = document.getElementById('depKey').textContent;
      if (!key) return;
      navigator.clipboard.writeText(key).then(() => toast(t('keyCopied'), 'success'));
    };

    // Load account info for header badge
    fetch('/account', { headers: { Authorization: 'Bearer ' + token() } })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return;
        const acc = d.account || d;
        const label = acc.email || acc.username || acc.name;
        if (label) {
          const badge = document.getElementById('accountBadge');
          badge.textContent = label;
          badge.classList.remove('hidden');
        }
      }).catch(() => {});

    // Bootstrap
    setLang(currentLang);
    loadApps()
      .then(() => {
        if (state.apps.length && !state.currentApp) {
          return selectApp(state.apps[0].name);
        }
      })
      .catch(e => toast(e.message, 'error'));
  </script>
</body>
</html>
