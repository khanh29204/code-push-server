<!DOCTYPE html><html><head><title>CodePush Server</title><meta name="keywords" content="code-push-server,code-push,react-native,cordova"><meta name="description" content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push"><link rel="stylesheet" href="/js/bootstrap-3.3.7/css/bootstrap.min.css"><link rel="stylesheet" href="/stylesheets/common.css"></head><body><div class="site-notice">react native / cordova hot update server</div><h1 style="text-align: center;">CodePush Server</h1><p style="text-align: center;">Welcome to CodePush Server</p><div class="site-notice"><a class="btn btn-primary" href="/tokens" type="button">Obtain token</a><a class="btn btn-primary col-md-offset-1" href="/auth/password" type="button">Change Password</a><a class="btn btn-primary col-md-offset-1" id="logoutBtn" href="#" type="button">Logout</a></div></body><script src="/js/jquery-3.1.1.min.js"></script><script src="/js/bootstrap-3.3.7/js/bootstrap.min.js"></script><script>function getAccessToken() {
    return localStorage.getItem('auth');
}
function ensureLogin() {
    if (!getAccessToken()) {
        window.location.href = '/auth/login';
    }
}
function logout() {
    localStorage.removeItem('auth');
    location.href = '/auth/login';
}
function parseQuery() {
  query = location.search.substring(1);
  var vars = query.split('&');
  var rs = {};
  for (var i = 0; i < vars.length; i++) {
    var pair = vars[i].split('=');
    rs[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
  }
  return rs;
}</script><script>ensureLogin();

$('#logoutBtn').on('click', logout);</script></html>
