version: '3.8'

services:
  server:
    build:
      context: ..
      dockerfile: rust/Dockerfile
    image: code-push-server-rust:latest
    container_name: code-push-server-rust
    ports:
      - "3000:3000"
    volumes:
      - ../data:/data
      - ../data-storage:/data-storage
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=sqlite:///data/codepush.db
      - STORAGE_DIR=/data-storage
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: code-push-redis
    ports:
      - "6379:6379"
    volumes:
      - ../data-redis:/data
    restart: unless-stopped
