<!DOCTYPE html><html><head><title>CodePush Server</title><meta name="keywords" content="code-push-server,code-push,react-native,cordova"><meta name="description" content="CodePush service is hotupdate services which adapter react-native-code-push and cordova-plugin-code-push"><link rel="stylesheet" href="/js/bootstrap-3.3.7/css/bootstrap.min.css"><link rel="stylesheet" href="/stylesheets/common.css"></head><body><div class="container" style="margin-top:30px;"><form class="col-md-5 col-md-offset-3" id="form" method="post"><div class="form-group"><label class="sr-only" for="inputPassword">old password</label><input class="form-control" id="inputPassword" type="password" name="oldPassword" placeholder="old password" required></div><div class="form-group"><label class="sr-only" for="inputNewPassword">new password</label><input class="form-control" id="inputNewPassword" type="password" name="newPassword" placeholder="new password" required></div><div class="form-group"><a class="btn btn-lg btn-primary btn-block" id="submitBtn">Change Password</a></div></form></div></body><script src="/js/jquery-3.1.1.min.js"></script><script src="/js/bootstrap-3.3.7/js/bootstrap.min.js"></script><script>function getAccessToken() {
    return localStorage.getItem('auth');
}
function ensureLogin() {
    if (!getAccessToken()) {
        window.location.href = '/auth/login';
    }
}
function logout() {
    localStorage.removeItem('auth');
    location.href = '/auth/login';
}
function parseQuery() {
  query = location.search.substring(1);
  var vars = query.split('&');
  var rs = {};
  for (var i = 0; i < vars.length; i++) {
    var pair = vars[i].split('=');
    rs[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
  }
  return rs;
}</script><script>ensureLogin();

var submit = false;
$('#submitBtn').on('click', function () {
  if (submit) {
    return ;
  }
  submit = true;
  var accessToken = getAccessToken();
  var oldPassword = $('#inputPassword').val();
  var newPassword = $('#inputNewPassword').val();
  $.ajax({
    type: 'patch',
    data: JSON.stringify({ oldPassword: oldPassword, newPassword: newPassword }),
    contentType: 'application/json;charset=utf-8',
    headers: {
      Authorization : 'Bearer ' + accessToken,
    },
    url: '/users/password',
    dataType: 'json',
    success: function (data) {
      if (data.status == "OK") {
        alert("change success");
        logout();
      } else if (data.status == 401) {
        alert('token invalid');
        logout();
      } else {
        alert(data.message);
      }
      submit = false;
    }
  });
});</script></html>
