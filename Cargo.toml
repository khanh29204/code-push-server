[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bcrypt = "0.19.2"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
hex = "0.4.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
md5 = "0.8.1"
rand = "0.8.5"
regex = "1.13.1"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
sha2 = "0.11.0"
sqlx = { version = "0.8.3", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full"] }
axum = { version = "0.8.1", features = ["macros", "multipart"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
zip = "8.6.0"
bb8-redis = "0.26.0"
redis = "1.4.1"
tower-http = { version = "0.7.0", features = ["fs", "normalize-path", "trace"] }
tower = "0.5.3"
lettre = { version = "0.11.22", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
panic = "abort"
strip = true
