services:
  redis:
    image: redis:7-alpine
    container_name: code-push-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    networks:
      - redis_private_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  redis_private_net:
    name: redis_private_net
